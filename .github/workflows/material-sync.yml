name: Sync Can Gio PBR materials
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pbr.py'
      - '.github/workflows/material-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image converter
        run: python -m pip install Pillow==11.3.0
      - name: Fetch and convert original CC0 maps
        run: python scripts/build_pbr.py
      - name: Commit browser-ready material maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/materials/
          if git diff --cached --quiet; then
            echo "No material changes"
          else
            git commit -m "Sync mangrove PBR texture maps (color, normal, roughness)"
            git push
          fi
